name: Build & Release

on:
  push:
    tags:
      - 'v*'           # v1.0.0, v1.2.3 etc. tag push hone par build hoga
  workflow_dispatch:   # GitHub UI se bhi manually trigger kar sako

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            zip

      - name: Install frontend dependencies
        run: npm install

      - name: Zip Browser Extension
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          zip -r msmdownloader-extension.zip browser-extension

      - name: Build & Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MSM Downloader ${{ github.ref_name }}'
          releaseBody: |
            ## MSM Downloader ${{ github.ref_name }}

            ### Downloads
            - **Linux**: `.AppImage` (portable) ya `.deb` (Ubuntu/Mint)
            - **Windows**: `.msi` (installer) ya `.exe` (NSIS)
            - **Browser Extension**: `msmdownloader-extension.zip` (Chrome, Edge, Brave, Opera, Firefox)

            ### Installation
            - **Linux Mint/Ubuntu**: `.deb` file download karke double-click/install karein
            - **Windows**: `.msi` file download karke install karein
            - **Browser Extension**: `msmdownloader-extension.zip` download karein, extract karein aur browser me load unpacked karein.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Extension to Release
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: msmdownloader-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
